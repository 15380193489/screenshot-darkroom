[package]
name = "screenshot-darkroom"
version = "0.2.1"
description = "截图冲洗室"
license = "MIT"
repository = "https://github.com/15380193489/screenshot-darkroom"
edition = "2024"
rust-version = "1.85"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.6", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22.1"
png = "0.18.1"
windows = { version = "0.61.3", features = [
 "Foundation", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage_Streams",
 "Win32_Foundation", "Win32_Security", "Win32_System_DataExchange", "Win32_System_Memory",
 "Win32_System_Threading", "Win32_System_WinRT", "Win32_System_Com",
 "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"
] }

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
codegen-units = 8
